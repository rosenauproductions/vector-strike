<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vector Strike</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: #000; color: #5cf; font: 16px/1.5 monospace; cursor: pointer; text-align: center; }
  #start h1 { font-size: 44px; letter-spacing: 8px; margin: 0 0 12px; color: #6df; text-shadow: 0 0 12px #39f; }
  #start .go { margin-top: 24px; padding: 10px 28px; border: 2px solid #6df; color: #fff; }
  #start .keys { margin-top: 28px; color: #7aa; font-size: 13px; }
  #start.loading .go { opacity: .4; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="start" class="loading">
  <h1>VECTOR STRIKE</h1>
  <div id="status">LOADING...</div>
  <div class="go">CLICK TO START</div>
  <div class="keys">KEYBOARD: ARROWS / WASD OR MOUSE TO FLY &middot; SPACE OR CLICK TO FIRE &middot; Q / E THROTTLE &middot; ENTER SELECT &middot; ESC PAUSE<br>
  GAMEPADS: PLUG IN AND PRESS A BUTTON (UP TO 4 PLAYERS)</div>
</div>
<script>
  var startEl = document.getElementById('start'), statusEl = document.getElementById('status'), ready = false;
  var Module = {
    canvas: document.getElementById('canvas'),
    noInitialRun: true,
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) { if (!ready) statusEl.textContent = t ? t.toUpperCase() : 'READY'; },
    onRuntimeInitialized: function () {
      // scores and options live in the browser's storage (IndexedDB), mounted at /save
      try { FS.mkdir('/save'); FS.mount(IDBFS, {}, '/save'); } catch (e) { console.warn(e); }
      FS.syncfs(true, function () { ready = true; startEl.classList.remove('loading'); statusEl.textContent = 'READY'; });
    }
  };
  // browsers only allow sound after a click, so the game starts on the first click / key
  function go() {
    if (!ready) return;
    startEl.remove(); Module.canvas.focus();
    Module._vs_start();
  }
  startEl.addEventListener('click', go);
  window.addEventListener('keydown', function k(e) { if (ready && document.getElementById('start')) { e.preventDefault(); go(); } });
</script>
<script src="vectorstrike.js"></script>
</body>
</html>
