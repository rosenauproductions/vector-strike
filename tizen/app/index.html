<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vector Strike</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: #000; color: #5cf; font: 16px/1.5 monospace; cursor: pointer; text-align: center; }
  #start h1 { font-size: 44px; letter-spacing: 8px; margin: 0 0 12px; color: #6df; text-shadow: 0 0 12px #39f; }
  #start .go { margin-top: 24px; padding: 10px 28px; border: 2px solid #6df; color: #fff; }
  #start .keys { margin-top: 28px; color: #7aa; font-size: 13px; }
  #start.loading .go { opacity: .4; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="start" class="loading">
  <h1>VECTOR STRIKE</h1>
  <div id="status">LOADING...</div>
  <div class="go">PRESS OK TO START</div>
  <div class="keys">TV REMOTE: ARROWS FLY &middot; OK FIRES / SELECTS &middot; BACK PAUSES / GOES BACK<br>
  GAMEPADS (USB OR BLUETOOTH): PRESS A TO JOIN, UP TO 4 PLAYERS &middot; BACK ON THIS SCREEN QUITS</div>
</div>
<script>
  var startEl = document.getElementById('start'), statusEl = document.getElementById('status'), ready = false;
  var Module = {
    canvas: document.getElementById('canvas'),
    noInitialRun: true,
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) { if (!ready) statusEl.textContent = t ? t.toUpperCase() : 'READY'; },
    onRuntimeInitialized: function () {
      // scores and options live in the browser's storage (IndexedDB), mounted at /save
      try { FS.mkdir('/save'); FS.mount(IDBFS, {}, '/save'); } catch (e) { console.warn(e); }
      FS.syncfs(true, function () { ready = true; startEl.classList.remove('loading'); statusEl.textContent = 'READY'; });
    }
  };
  // browsers only allow sound after a click, so the game starts on the first click / key
  function go() {
    if (!ready) return;
    startEl.remove(); Module.canvas.focus();
    Module._vs_start();
  }
  startEl.addEventListener('click', go);
  // Samsung remote: Back (10009) isn't a key SDL knows - pass it to the game; on this start screen it quits the app
  window.addEventListener('keydown', function (e) {
    if (e.keyCode !== 10009) return; e.preventDefault();
    if (document.getElementById('start')) { try { tizen.application.getCurrentApplication().exit(); } catch (x) {} return; }
    if (Module._vs_tvkey) Module._vs_tvkey(0, 1);
  }, true);
  window.addEventListener('keyup', function (e) { if (e.keyCode === 10009 && Module._vs_tvkey) Module._vs_tvkey(0, 0); }, true);
  try { tizen.tvinputdevice.registerKey('MediaPlayPause'); } catch (x) {}
  window.addEventListener('keydown', function k(e) { if (e.keyCode !== 10009 && ready && document.getElementById('start')) { e.preventDefault(); go(); } });
</script>
<script src="vectorstrike.js"></script>
</body>
</html>
