// Vector Strike for Android TV (and phones/tablets with a pad). The game is the same C++ as the Batocera build,
// on SDL2's Android port. SDL's source is fetched by the GitHub workflow into app/jni/SDL (see docs/TV_BUILDS.md).
plugins { id 'com.android.application' }
android {
    namespace 'com.rosenauproductions.vectorstrike'
    compileSdk 34
    defaultConfig {
        applicationId 'com.rosenauproductions.vectorstrike'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-std=c++17' } }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }   // personal sideload build: signed with the debug key
    }
    externalNativeBuild { cmake { path 'jni/CMakeLists.txt' } }
    sourceSets { main { assets.srcDirs = ['../../android-assets'] } }   // the workflow puts modelpack/ there
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError false; checkReleaseBuilds false }
}
